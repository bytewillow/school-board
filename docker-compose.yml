services:
  school-board:
    build: .
    container_name: school-board
    restart: unless-stopped
    environment:
      # 部署前在 shell / .env 里设好 ADMIN_PASSWORD，不要直接写进这个文件
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATA_DIR=/data
      - PORT=8765
      - TZ=${TZ:-Asia/Shanghai}
      # 可选：外部 AI 用的令牌（也可以在管理页生成）
      - API_TOKEN=${API_TOKEN:-}
      # 可选：AI 解析，密钥只放 shell / .env，不提交到仓库
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-}
      # 推送提醒：不填会自动生成并存在数据库里；VAPID_SUBJECT 建议改成你自己的邮箱
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:school-board@example.com}
    volumes:
      # 与旧版同一个目录：直接沿用原来的 board.db 和 uploads/
      - ./data:/data
    ports:
      # 只建议局域网 / Tailscale 访问；手机装 PWA 和收推送需要 HTTPS，请放在反向代理后面
      - "127.0.0.1:8765:8765"
